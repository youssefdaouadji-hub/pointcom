<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace client — point com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070711;--ink:#f1f3ff;--muted:#9aa0c4;--c1:#5eead4;--c2:#818cf8;--c3:#f0abfc;
  --line:rgba(140,150,220,.14);--glass:rgba(20,22,46,.5);--display:'Syne',sans-serif;--body:'Sora',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(60% 50% at 70% 10%,rgba(129,140,248,.22),transparent 70%),
  radial-gradient(55% 45% at 20% 90%,rgba(94,234,212,.16),transparent 70%),var(--bg)}
.aurora{position:fixed;inset:-30%;z-index:-2;filter:blur(90px);opacity:.4;
  background:conic-gradient(from 0deg at 50% 50%,var(--c1),var(--c2),var(--c3),var(--c1));
  animation:spin 28s linear infinite;mask-image:radial-gradient(circle at 50% 40%,black,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{max-width:480px;width:100%;border-radius:26px;padding:2px;
  background:linear-gradient(160deg,var(--line),transparent);box-shadow:0 50px 120px -50px rgba(129,140,248,.5)}
.card-in{background:#0a0b1c;border-radius:24px;padding:46px 40px;text-align:center}
.logo{display:inline-flex;margin-bottom:28px}.logo svg{height:34px;overflow:visible}
.ic{width:74px;height:74px;border-radius:20px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;
  background:linear-gradient(135deg,rgba(94,234,212,.16),rgba(129,140,248,.16));border:1px solid var(--line)}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.5px;margin-bottom:10px}
.lead{color:var(--muted);font-size:.95rem;margin-bottom:28px}
.field{text-align:left;margin-bottom:18px}
.field label{display:block;font-family:var(--display);font-weight:600;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.field input{width:100%;background:rgba(7,7,17,.6);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font-family:var(--body);font-size:.95rem;transition:.25s}
.field input:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px rgba(94,234,212,.13)}
.btn{width:100%;justify-content:center;font-family:var(--display);font-weight:600;padding:15px 28px;border-radius:999px;border:none;cursor:pointer;font-size:.95rem;
  display:inline-flex;align-items:center;gap:9px;background:linear-gradient(120deg,var(--c1),var(--c2));color:#070711;box-shadow:0 14px 40px -12px var(--c2);transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 22px 56px -14px var(--c2)}
.msg{font-size:.85rem;margin-top:16px;min-height:20px;color:var(--c3)}
.feats{display:flex;flex-direction:column;gap:10px;text-align:left;margin-bottom:28px}
.feats div{display:flex;gap:10px;align-items:center;color:#c9cff0;font-size:.88rem}
.feats span{color:var(--c1)}
.back{display:inline-block;margin-top:22px;color:var(--muted);text-decoration:none;font-size:.85rem;transition:.2s}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="bg"></div><div class="aurora"></div>
<div class="card">
  <div class="card-in">
    <div class="logo" aria-label="point com">
      <svg viewBox="0 0 182 44" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="d" cx="34%" cy="28%" r="85%"><stop offset="0%" stop-color="#a7f3e4"/><stop offset="45%" stop-color="#5eead4"/><stop offset="78%" stop-color="#818cf8"/><stop offset="100%" stop-color="#f0abfc"/></radialGradient>
          <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
        </defs>
        <circle cx="18" cy="23" r="15.5" fill="none" stroke="url(#t)" stroke-opacity=".35"/>
        <circle cx="18" cy="23" r="11" fill="url(#d)"/>
        <text x="42" y="31" font-family="Syne,sans-serif" font-weight="800" font-size="23" letter-spacing="-.5" fill="#f1f3ff">point<tspan dx="3" fill="url(#t)">com</tspan></text>
      </svg>
    </div>

    <div class="ic">⚙️</div>
    <h1>Gérer mon abonnement</h1>
    <p class="lead">Accédez à votre espace de facturation sécurisé pour gérer votre maintenance.</p>

    <div class="feats">
      <div><span>✓</span> Voir vos factures et paiements</div>
      <div><span>✓</span> Mettre à jour votre IBAN / moyen de paiement</div>
      <div><span>✓</span> Résilier la maintenance à tout moment</div>
    </div>

    <div class="field">
      <label>Email utilisé lors du paiement</label>
      <input type="email" id="email" placeholder="vous@email.com">
    </div>
    <button class="btn" id="go" onclick="openPortal()">Accéder à mon espace →</button>
    <p class="msg" id="msg"></p>

    <a href="/" class="back">← Retour à l'accueil</a>
  </div>
</div>

<script>
async function openPortal(){
  const email=document.getElementById('email').value.trim();
  const msg=document.getElementById('msg'),btn=document.getElementById('go');
  if(!email){msg.textContent='Merci de saisir votre email.';return;}
  btn.textContent='Connexion…';btn.style.pointerEvents='none';msg.textContent='';
  try{
    const res=await fetch('/customer-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const data=await res.json();
    if(res.ok&&data.url){window.location.href=data.url;return;}
    msg.textContent=data.error||"Une erreur est survenue.";
  }catch(e){
    msg.textContent='🔧 Mode démo — backend non connecté. En production, vous seriez redirigé vers votre espace Stripe.';
  }
  btn.textContent='Accéder à mon espace →';btn.style.pointerEvents='';
}
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')openPortal();});
</script>
</body>
</html>
