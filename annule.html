<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé — point com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070711;--ink:#f1f3ff;--muted:#9aa0c4;--c1:#5eead4;--c2:#818cf8;--c3:#f0abfc;
  --line:rgba(140,150,220,.14);--glass:rgba(20,22,46,.5);--display:'Syne',sans-serif;--body:'Sora',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(60% 50% at 70% 10%,rgba(129,140,248,.18),transparent 70%),
  radial-gradient(55% 45% at 20% 90%,rgba(240,171,252,.12),transparent 70%),var(--bg)}
.aurora{position:fixed;inset:-30%;z-index:-2;filter:blur(90px);opacity:.32;
  background:conic-gradient(from 0deg at 50% 50%,var(--c2),var(--c3),var(--c1),var(--c2));
  animation:spin 30s linear infinite;mask-image:radial-gradient(circle at 50% 40%,black,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{max-width:500px;width:100%;border-radius:26px;padding:2px;
  background:linear-gradient(160deg,var(--line),transparent);box-shadow:0 50px 120px -50px rgba(129,140,248,.45)}
.card-in{background:#0a0b1c;border-radius:24px;padding:48px 40px;text-align:center}
.logo{display:inline-flex;margin-bottom:28px}.logo svg{height:34px;overflow:visible}
.ic{width:78px;height:78px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(129,140,248,.16),rgba(240,171,252,.16));border:1px solid var(--line)}
.ic svg{width:38px;height:38px}
h1{font-family:var(--display);font-weight:800;font-size:1.8rem;letter-spacing:-.5px;margin-bottom:12px}
.lead{color:var(--muted);font-size:1rem;margin-bottom:30px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--display);font-weight:600;padding:14px 28px;border-radius:999px;text-decoration:none;font-size:.92rem;
  display:inline-flex;align-items:center;gap:8px;transition:.3s;border:1px solid transparent}
.btn-primary{background:linear-gradient(120deg,var(--c1),var(--c2));color:#070711;box-shadow:0 14px 40px -12px var(--c2)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 22px 56px -14px var(--c2)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--glass)}
.btn-ghost:hover{border-color:var(--c1);color:var(--c1)}
.muted-sm{color:var(--muted);font-size:.82rem;margin-top:26px}
.muted-sm a{color:var(--c1);text-decoration:none}
</style>
</head>
<body>
<div class="bg"></div><div class="aurora"></div>
<div class="card">
  <div class="card-in">
    <div class="logo" aria-label="point com">
      <svg viewBox="0 0 182 44" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="d" cx="34%" cy="28%" r="85%"><stop offset="0%" stop-color="#a7f3e4"/><stop offset="45%" stop-color="#5eead4"/><stop offset="78%" stop-color="#818cf8"/><stop offset="100%" stop-color="#f0abfc"/></radialGradient>
          <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
        </defs>
        <circle cx="18" cy="23" r="15.5" fill="none" stroke="url(#t)" stroke-opacity=".35"/>
        <circle cx="18" cy="23" r="11" fill="url(#d)"/>
        <text x="42" y="31" font-family="Syne,sans-serif" font-weight="800" font-size="23" letter-spacing="-.5" fill="#f1f3ff">point<tspan dx="3" fill="url(#t)">com</tspan></text>
      </svg>
    </div>

    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#t)" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
    </div>

    <h1>Paiement annulé</h1>
    <p class="lead">Aucun montant n'a été débité. Votre configuration est toujours là — vous pouvez reprendre quand vous voulez.</p>

    <div class="btns">
      <a href="/#contact" class="btn btn-primary">Reprendre ma commande →</a>
      <a href="/#offres" class="btn btn-ghost">Revoir les offres</a>
    </div>

    <p class="muted-sm">Une question ou un doute&nbsp;? Écrivez-nous, on vous accompagne — <a href="/#contact">nous contacter</a>.</p>
  </div>
</div>
</body>
</html>
